<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作進度表</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
            background: #f0f2f5;
            color: #2c3e50;
            min-height: 100vh;
        }

        /* ── Header ── */
        .app-header {
            background: linear-gradient(135deg, #1a2332 0%, #2c3e50 100%);
            color: white;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .app-header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
        .save-status {
            font-size: 12px;
            background: rgba(255,255,255,0.12);
            padding: 4px 12px;
            border-radius: 20px;
            transition: background 0.3s;
        }
        .save-status.saving { background: rgba(241,196,15,0.3); }

        /* ── Controls ── */
        .controls {
            padding: 12px 24px;
            background: white;
            border-bottom: 1px solid #e0e5eb;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .controls label { font-size: 13px; color: #666; margin-right: 2px; }
        .date-input {
            padding: 7px 10px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            color: #333;
        }
        .btn {
            padding: 7px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            transition: filter 0.15s, transform 0.1s;
            white-space: nowrap;
        }
        .btn:hover { filter: brightness(1.1); }
        .btn:active { transform: scale(0.97); }
        .btn-add   { background: #27ae60; color: white; }
        .btn-toggle { background: #8e44ad; color: white; }
        .btn-export { background: #2980b9; color: white; }
        .btn-csv    { background: #16a085; color: white; }

        .mode-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: white;
            background: #8e44ad;
            transition: background 0.3s;
        }

        /* ── Table ── */
        .table-wrapper {
            padding: 20px 24px;
            overflow-x: auto;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.09);
            overflow: hidden;
            min-width: 500px;
        }

        /* Header row */
        thead th {
            background: #2c3e50;
            color: white;
            padding: 11px 14px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            position: relative;
            min-width: 190px;
        }
        thead th:first-child {
            min-width: 155px;
            text-align: left;
            background: #1a2332;
        }
        .date-header { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .date-main { font-size: 14px; }
        .date-week { font-size: 11px; opacity: 0.65; }
        thead th.col-today { background: #1e8449 !important; }

        .delete-col-btn {
            position: absolute;
            top: 5px; right: 5px;
            background: rgba(255,255,255,0.18);
            border: none;
            color: rgba(255,255,255,0.8);
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            padding: 2px 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        thead th:hover .delete-col-btn { opacity: 1; }

        /* Body cells */
        tbody td {
            border-top: 1px solid #edf0f4;
            border-right: 1px solid #edf0f4;
            vertical-align: top;
        }
        tbody td:last-child { border-right: none; }

        td.row-label {
            background: #f5f7fa;
            border-right: 2px solid #dde3eb !important;
            padding: 14px 16px;
            font-weight: 600;
            font-size: 13px;
            color: #4a5568;
            white-space: nowrap;
            vertical-align: middle;
            min-width: 155px;
            user-select: none;
        }
        td.row-label .label-dot {
            display: inline-block;
            width: 9px; height: 9px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        #row-today  td.row-label .label-dot { background: #27ae60; }
        #row-next   td.row-label .label-dot { background: #8e44ad; }
        #row-notes  td.row-label .label-dot { background: #f39c12; }

        td.editable {
            padding: 10px 12px;
            outline: none;
            font-size: 13px;
            line-height: 1.65;
            min-height: 82px;
            cursor: text;
            color: #3d4a5a;
            transition: background 0.15s;
        }
        td.editable:focus {
            box-shadow: inset 0 0 0 2px #3498db;
            z-index: 1;
            position: relative;
        }
        td.editable:empty::before {
            content: attr(data-placeholder);
            color: #c5cbd3;
            font-style: italic;
            pointer-events: none;
        }

        #row-today td.editable  { background: #f9fff9; }
        #row-next  td.editable  { background: #fdf7ff; }
        #row-notes td.editable  { background: #fffdf5; }
        #row-today td.editable:focus  { background: #f0fff4; }
        #row-next  td.editable:focus  { background: #f5edff; }
        #row-notes td.editable:focus  { background: #fffbec; }

        td.editable.col-today-cell { border-top: 2px solid #27ae60 !important; }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 14px;
            font-size: 11px;
            color: #b0bec5;
        }
    </style>
</head>
<body>

<header class="app-header">
    <h1>工作進度表</h1>
    <span class="save-status" id="save-status">✓ 已儲存</span>
</header>

<div class="controls">
    <label for="new-date-input">日期：</label>
    <input type="date" id="new-date-input" class="date-input">
    <button class="btn btn-add" onclick="addDateColumn()">＋ 新增日期</button>
    <button class="btn btn-toggle" id="toggle-btn" onclick="toggleRow2Mode()">切換 → 下週</button>
    <span class="mode-badge" id="mode-badge">目前：明日</span>
    <button class="btn btn-export" onclick="exportJSON()">匯出 JSON</button>
    <button class="btn btn-csv" onclick="exportCSV()">匯出 CSV</button>
</div>

<div class="table-wrapper">
    <table id="progress-table">
        <thead>
            <tr id="header-row">
                <th>項目 / 日期</th>
            </tr>
        </thead>
        <tbody>
            <tr id="row-today">
                <td class="row-label"><span class="label-dot"></span>當日工作進度</td>
            </tr>
            <tr id="row-next">
                <td class="row-label" id="row2-label"><span class="label-dot"></span>明日工作進度</td>
            </tr>
            <tr id="row-notes">
                <td class="row-label"><span class="label-dot"></span>備註</td>
            </tr>
        </tbody>
    </table>
</div>

<div class="footer">資料自動儲存於瀏覽器 LocalStorage · 搭配 GitHub 進行版本管理</div>

<script>
    const WEEKDAYS = ['日','一','二','三','四','五','六'];

    /* ── State ── */
    let state = { dates: [], row2Mode: 'tomorrow', data: {} };

    function loadState() {
        try {
            const s = localStorage.getItem('workProgressState_v1');
            if (s) state = Object.assign({ dates:[], row2Mode:'tomorrow', data:{} }, JSON.parse(s));
        } catch(_) {}
        if (!state.dates.length) state.dates = [todayStr()];
    }

    function saveState() {
        const el = document.getElementById('save-status');
        el.textContent = '… 儲存中';
        el.classList.add('saving');
        localStorage.setItem('workProgressState_v1', JSON.stringify(state));
        setTimeout(() => {
            el.textContent = '✓ 已儲存';
            el.classList.remove('saving');
        }, 400);
    }

    /* ── Helpers ── */
    function todayStr() {
        return new Date().toISOString().split('T')[0];
    }

    function fmtDate(ds) {
        const d = new Date(ds + 'T00:00:00');
        return {
            main: `${d.getMonth()+1}/${d.getDate()}`,
            week: `週${WEEKDAYS[d.getDay()]}`
        };
    }

    function ensureDate(ds) {
        if (!state.data[ds]) state.data[ds] = { today:'', tomorrow:'', nextweek:'', notes:'' };
    }

    function nextKey() { return state.row2Mode === 'tomorrow' ? 'tomorrow' : 'nextweek'; }
    function nextLabel() { return state.row2Mode === 'tomorrow' ? '明日工作進度' : '下週工作進度'; }
    function nextPlaceholder() { return state.row2Mode === 'tomorrow' ? '輸入明日工作進度…' : '輸入下週工作進度…'; }

    /* ── Render ── */
    function renderTable() {
        const hdr  = document.getElementById('header-row');
        const rTod = document.getElementById('row-today');
        const rNxt = document.getElementById('row-next');
        const rNts = document.getElementById('row-notes');

        [hdr, rTod, rNxt, rNts].forEach(row => {
            while (row.children.length > 1) row.removeChild(row.lastChild);
        });

        // Update row2 label text (keep dot span)
        const lbl2 = document.getElementById('row2-label');
        const dot2 = lbl2.querySelector('.label-dot');
        lbl2.textContent = '';
        lbl2.appendChild(dot2);
        lbl2.append(nextLabel());

        const today = todayStr();

        state.dates.forEach(ds => {
            ensureDate(ds);
            const f = fmtDate(ds);
            const isToday = ds === today;

            /* -- header -- */
            const th = document.createElement('th');
            if (isToday) th.classList.add('col-today');
            th.innerHTML = `
                <div class="date-header">
                    <span class="date-main">${f.main}</span>
                    <span class="date-week">${f.week}</span>
                </div>
                <button class="delete-col-btn" onclick="deleteDate('${ds}')" title="刪除此欄">✕</button>
            `;
            hdr.appendChild(th);

            /* -- cells -- */
            rTod.appendChild(mkCell(ds, 'today',    '輸入當日工作進度…', isToday));
            rNxt.appendChild(mkCell(ds, nextKey(),  nextPlaceholder(),    isToday));
            rNts.appendChild(mkCell(ds, 'notes',    '輸入備註…',          isToday));
        });

        updateToggleUI();
    }

    function mkCell(ds, field, placeholder, isToday) {
        const td = document.createElement('td');
        td.className = 'editable' + (isToday ? ' col-today-cell' : '');
        td.contentEditable = 'true';
        td.setAttribute('data-placeholder', placeholder);
        td.textContent = state.data[ds][field] || '';

        td.addEventListener('input', () => {
            ensureDate(ds);
            state.data[ds][field] = td.textContent;
            saveState();
        });

        /* preserve newlines on paste */
        td.addEventListener('paste', e => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text');
            document.execCommand('insertText', false, text);
        });

        return td;
    }

    /* ── Actions ── */
    function addDateColumn() {
        const inp = document.getElementById('new-date-input');
        let ds = inp.value;

        if (!ds) {
            if (state.dates.length) {
                const last = new Date(state.dates[state.dates.length - 1] + 'T00:00:00');
                last.setDate(last.getDate() + 1);
                ds = last.toISOString().split('T')[0];
            } else {
                ds = todayStr();
            }
        }

        if (state.dates.includes(ds)) { alert('此日期已存在！'); return; }
        state.dates.push(ds);
        state.dates.sort();
        ensureDate(ds);
        saveState();
        renderTable();
        inp.value = '';
    }

    function deleteDate(ds) {
        if (!confirm(`確定要刪除「${ds}」的欄位嗎？\n（資料將一併清除）`)) return;
        state.dates = state.dates.filter(d => d !== ds);
        delete state.data[ds];
        saveState();
        renderTable();
    }

    function toggleRow2Mode() {
        state.row2Mode = state.row2Mode === 'tomorrow' ? 'nextweek' : 'tomorrow';
        saveState();
        renderTable();
    }

    function updateToggleUI() {
        const btn   = document.getElementById('toggle-btn');
        const badge = document.getElementById('mode-badge');
        if (state.row2Mode === 'tomorrow') {
            btn.textContent   = '切換 → 下週';
            badge.textContent = '目前：明日';
            badge.style.background = '#8e44ad';
        } else {
            btn.textContent   = '切換 → 明日';
            badge.textContent = '目前：下週';
            badge.style.background = '#d35400';
        }
    }

    /* ── Export ── */
    function exportJSON() {
        dl('work-progress.json', JSON.stringify(state, null, 2), 'application/json');
    }

    function exportCSV() {
        const rows = [['日期','當日工作進度','明日工作進度','下週工作進度','備註']];
        state.dates.forEach(ds => {
            const d = state.data[ds] || {};
            rows.push([ds, d.today||'', d.tomorrow||'', d.nextweek||'', d.notes||'']);
        });
        const csv = rows.map(r => r.map(c => `"${c.replace(/"/g,'""')}"`).join(',')).join('\r\n');
        dl('work-progress.csv', '﻿' + csv, 'text/csv');  // BOM for Excel
    }

    function dl(name, content, mime) {
        const a = Object.assign(document.createElement('a'), {
            href: URL.createObjectURL(new Blob([content], {type: mime})),
            download: name
        });
        a.click();
        URL.revokeObjectURL(a.href);
    }

    /* ── Init ── */
    loadState();
    document.getElementById('new-date-input').value = todayStr();
    renderTable();
</script>
</body>
</html>
