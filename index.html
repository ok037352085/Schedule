<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作進度表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream:      #F5F1E8;
            --cream-dark: #ECE7DA;
            --ink:        #0C0A08;
            --ink-mid:    #47403A;
            --ink-light:  #88807A;
            --rule:       #C4BAA8;
            --rule-light: #DDD6C8;
            --red:        #B03A2E;
            --green:      #2B6040;
            --blue:       #2A4A72;
            --mono:       'Fira Code', 'Consolas', monospace;
            --serif:      'Libre Baskerville', Georgia, serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 14px; }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: var(--mono);
            min-height: 100vh;
        }

        /* top accent stripe */
        body::before {
            content: '';
            display: block;
            height: 3px;
            background: var(--red);
        }

        /* ── HEADER ─────────────────────────────── */
        .app-header {
            background: var(--ink);
            color: var(--cream);
            padding: 0 28px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 18px;
        }

        .header-title {
            font-family: var(--serif);
            font-style: italic;
            font-size: 22px;
            color: var(--cream);
            letter-spacing: 0.01em;
        }

        .header-meta {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(245,241,232,0.3);
        }

        .save-indicator {
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(245,241,232,0.28);
            transition: color 0.2s;
        }
        .save-indicator.saving { color: #D4894A; }

        /* ── TOOLBAR ─────────────────────────────── */
        .toolbar {
            background: var(--cream-dark);
            border-bottom: 1.5px solid var(--ink);
            padding: 0 28px;
            height: 44px;
            display: flex;
            align-items: center;
        }

        .t-group {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 18px;
            margin-right: 18px;
            border-right: 1px solid var(--rule);
        }
        .t-group:last-child { border-right: none; padding-right: 0; margin-right: 0; }

        .t-label {
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-light);
        }

        input[type="date"] {
            background: transparent;
            border: 1px solid var(--rule);
            padding: 4px 8px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--ink);
            outline: none;
            cursor: pointer;
            border-radius: 0;
        }
        input[type="date"]:focus { border-color: var(--ink); }

        .btn {
            padding: 4px 12px;
            border: 1px solid currentColor;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            background: transparent;
            border-radius: 0;
            transition: background 0.12s, color 0.12s;
        }

        .btn-ink  { color: var(--ink); }
        .btn-ink:hover { background: var(--ink); color: var(--cream); }

        .btn-red  { color: var(--red); border-color: var(--red); }
        .btn-red:hover { background: var(--red); color: var(--cream); }

        .btn-dim  { color: var(--ink-light); border-color: var(--rule); }
        .btn-dim:hover { background: var(--ink-mid); color: var(--cream); border-color: var(--ink-mid); }

        .mode-chip {
            display: inline-block;
            padding: 3px 9px;
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--cream);
            background: var(--red);
        }

        /* ── TABLE ───────────────────────────────── */
        .table-wrapper {
            padding: 24px 28px 36px;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 560px;
            border: 1.5px solid var(--ink);
        }

        thead th {
            background: var(--ink);
            color: var(--cream);
            padding: 8px 14px;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-align: center;
            border-right: 1px solid rgba(245,241,232,0.1);
            position: relative;
            min-width: 210px;
        }
        thead th:first-child {
            min-width: 148px;
            width: 148px;
            text-align: left;
            border-right: 1.5px solid rgba(245,241,232,0.22);
        }
        thead th:last-child { border-right: none; }
        thead th.col-today { background: var(--green); }

        .th-inner { display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .th-day   { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; }
        .th-dow   { font-size: 10px; opacity: 0.48; letter-spacing: 0.16em; }

        .del-btn {
            position: absolute;
            top: 4px; right: 5px;
            background: none;
            border: none;
            color: rgba(245,241,232,0.22);
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 1px 3px;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s;
        }
        thead th:hover .del-btn { opacity: 1; }
        .del-btn:hover { color: rgba(245,241,232,0.85); }

        tbody tr { border-bottom: 1px solid var(--rule-light); }
        tbody tr:last-child { border-bottom: none; }

        tbody td {
            border-right: 1px solid var(--rule-light);
            vertical-align: top;
        }
        tbody td:last-child { border-right: none; }

        /* Row label cells */
        td.row-label {
            background: var(--ink);
            border-right: 1.5px solid var(--ink) !important;
            padding: 12px 14px;
            vertical-align: middle;
            white-space: nowrap;
            user-select: none;
        }

        .lbl-num {
            display: block;
            font-family: var(--serif);
            font-style: italic;
            font-size: 19px;
            color: rgba(245,241,232,0.15);
            line-height: 1;
            margin-bottom: 4px;
        }

        .lbl-text {
            display: block;
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        #row-today .lbl-text { color: #72C290; }
        #row-next  .lbl-text { color: #E8956A; }
        #row-notes .lbl-text { color: #7AADCF; }

        /* Editable cells */
        td.editable {
            padding: 11px 14px;
            outline: none;
            font-family: var(--mono);
            font-size: 12.5px;
            line-height: 1.72;
            min-height: 90px;
            cursor: text;
            color: var(--ink-mid);
            background: var(--cream);
            transition: background 0.1s;
        }

        td.editable:focus {
            background: #FDFCF8;
            box-shadow: inset 2px 0 0 var(--red);
            color: var(--ink);
            position: relative;
            z-index: 1;
        }

        td.editable:empty::before {
            content: attr(data-placeholder);
            color: var(--rule);
            font-style: italic;
            pointer-events: none;
        }

        #row-today td.editable { background: #F4F1E9; }
        #row-next  td.editable { background: #F5F0EA; }
        #row-notes td.editable { background: #F4F2EA; }
        #row-today td.editable:focus,
        #row-next  td.editable:focus,
        #row-notes td.editable:focus { background: #FDFCF8; }

        td.editable.col-today-cell {
            border-top: 2px solid var(--green) !important;
        }

        /* ── FOOTER ──────────────────────────────── */
        .footer {
            padding: 12px 28px;
            border-top: 1px solid var(--rule-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-l {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-light);
        }
        .footer-r {
            font-family: var(--serif);
            font-style: italic;
            font-size: 13px;
            color: var(--rule);
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="header-left">
        <span class="header-title">工作進度表</span>
        <span class="header-meta">Work Log</span>
    </div>
    <span class="save-indicator" id="save-status">Saved</span>
</header>

<div class="toolbar">
    <div class="t-group">
        <span class="t-label">Date</span>
        <input type="date" id="new-date-input">
        <button class="btn btn-ink" onclick="addDateColumn()">+ Add</button>
    </div>
    <div class="t-group">
        <button class="btn btn-red" id="toggle-btn" onclick="toggleRow2Mode()">→ Next Week</button>
        <span class="mode-chip" id="mode-badge">Tomorrow</span>
    </div>
    <div class="t-group">
        <button class="btn btn-dim" onclick="exportJSON()">JSON</button>
        <button class="btn btn-dim" onclick="exportCSV()">CSV</button>
    </div>
</div>

<div class="table-wrapper">
    <table id="progress-table">
        <thead>
            <tr id="header-row">
                <th>— / —</th>
            </tr>
        </thead>
        <tbody>
            <tr id="row-today">
                <td class="row-label">
                    <span class="lbl-num">01</span>
                    <span class="lbl-text">當日進度</span>
                </td>
            </tr>
            <tr id="row-next">
                <td class="row-label">
                    <span class="lbl-num">02</span>
                    <span class="lbl-text" id="row2-lbl">明日進度</span>
                </td>
            </tr>
            <tr id="row-notes">
                <td class="row-label">
                    <span class="lbl-num">03</span>
                    <span class="lbl-text">備　　註</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<footer class="footer">
    <span class="footer-l">Auto-saved · GitHub Pages</span>
    <span class="footer-r" id="footer-date"></span>
</footer>

<script>
    const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    let state = { dates: [], row2Mode: 'tomorrow', data: {} };

    function loadState() {
        try {
            const s = localStorage.getItem('workProgressState_v1');
            if (s) state = Object.assign({ dates:[], row2Mode:'tomorrow', data:{} }, JSON.parse(s));
        } catch(_) {}
        if (!state.dates.length) state.dates = [todayStr()];
    }

    let saveTimer;
    function saveState() {
        const el = document.getElementById('save-status');
        el.textContent = 'Saving…';
        el.classList.add('saving');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
            localStorage.setItem('workProgressState_v1', JSON.stringify(state));
            el.textContent = 'Saved';
            el.classList.remove('saving');
        }, 500);
    }

    function todayStr() { return new Date().toISOString().split('T')[0]; }

    function fmtDate(ds) {
        const d = new Date(ds + 'T00:00:00');
        const mm = String(d.getMonth()+1).padStart(2,'0');
        const dd = String(d.getDate()).padStart(2,'0');
        return { day: `${mm}.${dd}`, dow: DOW[d.getDay()] };
    }

    function ensureDate(ds) {
        if (!state.data[ds]) state.data[ds] = { today:'', tomorrow:'', nextweek:'', notes:'' };
    }

    function nextKey() { return state.row2Mode === 'tomorrow' ? 'tomorrow' : 'nextweek'; }

    function renderTable() {
        const hdr  = document.getElementById('header-row');
        const rTod = document.getElementById('row-today');
        const rNxt = document.getElementById('row-next');
        const rNts = document.getElementById('row-notes');

        [hdr, rTod, rNxt, rNts].forEach(r => {
            while (r.children.length > 1) r.removeChild(r.lastChild);
        });

        document.getElementById('row2-lbl').textContent =
            state.row2Mode === 'tomorrow' ? '明日進度' : '下週進度';

        const today = todayStr();

        state.dates.forEach(ds => {
            ensureDate(ds);
            const f = fmtDate(ds);
            const isToday = ds === today;

            const th = document.createElement('th');
            if (isToday) th.classList.add('col-today');
            th.innerHTML = `
                <div class="th-inner">
                    <span class="th-day">${f.day}</span>
                    <span class="th-dow">${f.dow}${isToday ? ' · Today' : ''}</span>
                </div>
                <button class="del-btn" onclick="deleteDate('${ds}')" title="Remove">×</button>
            `;
            hdr.appendChild(th);

            const ph = { today:'當日工作進度…', tomorrow:'明日計畫…', nextweek:'下週計畫…', notes:'備註…' };

            rTod.appendChild(mkCell(ds, 'today',    ph.today,        isToday));
            rNxt.appendChild(mkCell(ds, nextKey(),  ph[nextKey()],   isToday));
            rNts.appendChild(mkCell(ds, 'notes',    ph.notes,        isToday));
        });

        updateToggleUI();
    }

    function mkCell(ds, field, placeholder, isToday) {
        const td = document.createElement('td');
        td.className = 'editable' + (isToday ? ' col-today-cell' : '');
        td.contentEditable = 'true';
        td.setAttribute('data-placeholder', placeholder);
        td.textContent = state.data[ds][field] || '';

        td.addEventListener('input', () => {
            ensureDate(ds);
            state.data[ds][field] = td.textContent;
            saveState();
        });

        td.addEventListener('paste', e => {
            e.preventDefault();
            document.execCommand('insertText', false,
                (e.clipboardData || window.clipboardData).getData('text'));
        });

        return td;
    }

    function addDateColumn() {
        const inp = document.getElementById('new-date-input');
        let ds = inp.value;
        if (!ds) {
            const base = state.dates.length
                ? new Date(state.dates[state.dates.length-1] + 'T00:00:00')
                : new Date();
            base.setDate(base.getDate() + 1);
            ds = base.toISOString().split('T')[0];
        }
        if (state.dates.includes(ds)) { alert('此日期已存在'); return; }
        state.dates.push(ds);
        state.dates.sort();
        ensureDate(ds);
        saveState();
        renderTable();
        inp.value = '';
    }

    function deleteDate(ds) {
        if (!confirm(`刪除 ${ds}？`)) return;
        state.dates = state.dates.filter(d => d !== ds);
        delete state.data[ds];
        saveState();
        renderTable();
    }

    function toggleRow2Mode() {
        state.row2Mode = state.row2Mode === 'tomorrow' ? 'nextweek' : 'tomorrow';
        saveState();
        renderTable();
    }

    function updateToggleUI() {
        const btn   = document.getElementById('toggle-btn');
        const badge = document.getElementById('mode-badge');
        if (state.row2Mode === 'tomorrow') {
            btn.textContent = '→ Next Week';
            badge.textContent = 'Tomorrow';
            badge.style.background = '#B03A2E';
        } else {
            btn.textContent = '→ Tomorrow';
            badge.textContent = 'Next Week';
            badge.style.background = '#2A4A72';
        }
    }

    function exportJSON() {
        dl('work-progress.json', JSON.stringify(state, null, 2), 'application/json');
    }

    function exportCSV() {
        const rows = [['日期','當日','明日','下週','備註']];
        state.dates.forEach(ds => {
            const d = state.data[ds] || {};
            rows.push([ds, d.today||'', d.tomorrow||'', d.nextweek||'', d.notes||'']);
        });
        const csv = rows.map(r => r.map(c => `"${c.replace(/"/g,'""')}"`).join(',')).join('\r\n');
        dl('work-progress.csv', '﻿'+csv, 'text/csv');
    }

    function dl(name, content, mime) {
        const a = Object.assign(document.createElement('a'), {
            href: URL.createObjectURL(new Blob([content], {type:mime})),
            download: name
        });
        a.click();
        URL.revokeObjectURL(a.href);
    }

    document.getElementById('footer-date').textContent =
        new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric' });

    loadState();
    document.getElementById('new-date-input').value = todayStr();
    renderTable();
</script>
</body>
</html>
