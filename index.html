<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作進度表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream:      #F5F1E8;
            --cream-dark: #ECE7DA;
            --ink:        #0C0A08;
            --ink-mid:    #47403A;
            --ink-light:  #88807A;
            --rule:       #C4BAA8;
            --rule-light: #DDD6C8;
            --red:        #B03A2E;
            --green:      #2B6040;
            --green-pale: rgba(43,96,64,0.09);
            --amber:      #C47A2E;
            --blue:       #2A4A72;
            --mono:       'Fira Code', 'Consolas', monospace;
            --serif:      'Libre Baskerville', Georgia, serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 14px; }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: var(--mono);
            min-height: 100vh;
        }

        body::before {
            content: '';
            display: block;
            height: 3px;
            background: var(--red);
        }

        /* ── HEADER ── */
        .app-header {
            background: var(--ink);
            color: var(--cream);
            padding: 0 28px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left { display: flex; align-items: baseline; gap: 18px; }
        .header-title {
            font-family: var(--serif);
            font-style: italic;
            font-size: 22px;
            color: var(--cream);
        }
        .header-meta {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(245,241,232,0.3);
        }
        .save-indicator {
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(245,241,232,0.28);
            transition: color 0.2s;
        }
        .save-indicator.saving { color: #D4894A; }

        /* ── CAL TOOLBAR ── */
        .cal-toolbar {
            background: var(--cream-dark);
            border-bottom: 1.5px solid var(--ink);
            padding: 0 28px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cal-nav { display: flex; align-items: center; gap: 12px; }
        .cal-nav-btn {
            background: none;
            border: 1px solid var(--rule);
            color: var(--ink);
            cursor: pointer;
            font-size: 15px;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.12s, color 0.12s;
            font-family: var(--mono);
        }
        .cal-nav-btn:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }
        .cal-month-label {
            font-family: var(--serif);
            font-style: italic;
            font-size: 18px;
            min-width: 220px;
        }
        .cal-today-btn {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: none;
            border: 1px solid var(--rule);
            color: var(--ink-light);
            padding: 3px 10px;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
        }
        .cal-today-btn:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }

        .export-group { display: flex; gap: 6px; }
        .btn {
            padding: 4px 12px;
            border: 1px solid var(--rule);
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            background: transparent;
            color: var(--ink-light);
            transition: background 0.12s, color 0.12s;
        }
        .btn:hover { background: var(--ink-mid); color: var(--cream); border-color: var(--ink-mid); }

        /* ── CALENDAR ── */
        .cal-wrap { padding: 0 28px 36px; }

        .cal-dow-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border: 1.5px solid var(--ink);
            border-bottom: none;
        }
        .cal-dow {
            padding: 7px 8px;
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-light);
            text-align: center;
            background: var(--cream-dark);
            border-right: 1px solid var(--rule-light);
        }
        .cal-dow:last-child { border-right: none; }
        .cal-dow.weekend { color: var(--rule); }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border: 1.5px solid var(--ink);
        }

        .cal-cell {
            border-right: 1px solid var(--rule-light);
            border-bottom: 1px solid var(--rule-light);
            min-height: 90px;
            padding: 8px;
            cursor: pointer;
            background: var(--cream);
            transition: background 0.1s;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .cal-cell:nth-child(7n)      { border-right: none; }
        .cal-cell:nth-last-child(-n+7) { border-bottom: none; }
        .cal-cell:hover              { background: #EEE9DE; }

        .cal-cell.other-month { background: #F8F5EE; }
        .cal-cell.other-month:hover { background: #F3EFE6; }
        .cal-cell.other-month .cal-num { color: var(--rule); }

        .cal-cell.weekend     { background: #F3EFE8; }
        .cal-cell.weekend:hover { background: #EAE5DA; }

        .cal-cell.is-today    { background: var(--green-pale); }
        .cal-cell.is-today:hover { background: rgba(43,96,64,0.13); }

        .cal-num {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--ink);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px; height: 22px;
            flex-shrink: 0;
        }
        .cal-cell.is-today .cal-num {
            background: var(--green);
            color: var(--cream);
        }

        .cal-preview {
            font-size: 10px;
            color: var(--ink-mid);
            line-height: 1.45;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            flex: 1;
        }
        .cal-cell.other-month .cal-preview { display: none; }

        .cal-dots {
            display: flex;
            gap: 3px;
            margin-top: auto;
        }
        .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-today { background: var(--green); }
        .dot-next  { background: var(--amber); }
        .dot-notes { background: var(--blue); }

        /* ── MODAL ── */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(12,10,8,0.52);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-backdrop.open { display: flex; }

        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.97) translateY(6px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal {
            background: var(--cream);
            border: 1.5px solid var(--ink);
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            animation: modal-in 0.18s ease-out;
        }

        .modal-head {
            background: var(--ink);
            color: var(--cream);
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .modal-date-big {
            font-family: var(--serif);
            font-style: italic;
            font-size: 20px;
            color: var(--cream);
            line-height: 1.2;
        }
        .modal-date-sub {
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(245,241,232,0.42);
            margin-top: 3px;
        }
        .modal-close {
            background: none;
            border: 1px solid rgba(245,241,232,0.22);
            color: rgba(245,241,232,0.55);
            cursor: pointer;
            font-family: var(--mono);
            font-size: 17px;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.12s, color 0.12s;
            flex-shrink: 0;
        }
        .modal-close:hover { background: rgba(245,241,232,0.12); color: var(--cream); }

        .modal-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-field { display: flex; flex-direction: column; gap: 5px; }

        .field-lbl-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .field-lbl {
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 500;
        }
        .lbl-today { color: var(--green); }
        .lbl-next  { color: var(--amber); }
        .lbl-notes { color: var(--blue); }

        .field-toggle {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: none;
            border: 1px solid var(--rule);
            color: var(--ink-light);
            cursor: pointer;
            padding: 2px 8px;
            transition: background 0.12s, color 0.12s;
        }
        .field-toggle:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }

        .field-ta {
            width: 100%;
            min-height: 76px;
            padding: 10px 12px;
            background: white;
            border: 1px solid var(--rule-light);
            border-top: 2px solid var(--rule);
            font-family: var(--mono);
            font-size: 12.5px;
            line-height: 1.7;
            color: var(--ink);
            resize: vertical;
            outline: none;
            transition: border-top-color 0.12s;
        }
        .field-ta:focus { border-top-color: var(--red); }
        .field-ta::placeholder { color: var(--rule); font-style: italic; }

        /* ── FOOTER ── */
        .footer {
            padding: 12px 28px;
            border-top: 1px solid var(--rule-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-l { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-light); }
        .footer-r { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--rule); }

        /* ── Legend ── */
        .legend {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 28px 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-light);
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="header-left">
        <span class="header-title">工作進度表</span>
        <span class="header-meta">Work Log</span>
    </div>
    <span class="save-indicator" id="save-status">Saved</span>
</header>

<div class="cal-toolbar">
    <div class="cal-nav">
        <button class="cal-nav-btn" onclick="prevMonth()">‹</button>
        <span class="cal-month-label" id="cal-month-label">—</span>
        <button class="cal-nav-btn" onclick="nextMonth()">›</button>
        <button class="cal-today-btn" onclick="goToday()">Today</button>
    </div>
    <div class="export-group">
        <button class="btn" onclick="exportJSON()">JSON</button>
        <button class="btn" onclick="exportCSV()">CSV</button>
    </div>
</div>

<div class="legend">
    <span class="legend-item"><span class="dot dot-today"></span>當日</span>
    <span class="legend-item"><span class="dot dot-next"></span>明日／下週</span>
    <span class="legend-item"><span class="dot dot-notes"></span>備註</span>
</div>

<div class="cal-wrap" style="padding-top:12px">
    <div class="cal-dow-row">
        <div class="cal-dow weekend">Sun</div>
        <div class="cal-dow">Mon</div>
        <div class="cal-dow">Tue</div>
        <div class="cal-dow">Wed</div>
        <div class="cal-dow">Thu</div>
        <div class="cal-dow">Fri</div>
        <div class="cal-dow weekend">Sat</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
</div>

<footer class="footer">
    <span class="footer-l">點擊日期紀錄進度 · Auto-saved</span>
    <span class="footer-r" id="footer-date"></span>
</footer>

<!-- Modal -->
<div class="modal-backdrop" id="modal-backdrop" onclick="onBackdropClick(event)">
    <div class="modal" id="modal">
        <div class="modal-head">
            <div>
                <div class="modal-date-big" id="modal-date-big">—</div>
                <div class="modal-date-sub" id="modal-date-sub">—</div>
            </div>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="modal-field">
                <div class="field-lbl-row">
                    <span class="field-lbl lbl-today">01 · 當日工作進度</span>
                </div>
                <textarea class="field-ta" id="f-today" placeholder="今天完成了什麼…"></textarea>
            </div>
            <div class="modal-field">
                <div class="field-lbl-row">
                    <span class="field-lbl lbl-next" id="f-next-lbl">02 · 明日工作進度</span>
                    <button class="field-toggle" id="f-toggle" onclick="toggleMode()">切換→ 下週</button>
                </div>
                <textarea class="field-ta" id="f-next" placeholder="明日計畫…"></textarea>
            </div>
            <div class="modal-field">
                <div class="field-lbl-row">
                    <span class="field-lbl lbl-notes">03 · 備　　註</span>
                </div>
                <textarea class="field-ta" id="f-notes" placeholder="備註…"></textarea>
            </div>
        </div>
    </div>
</div>

<script>
    const MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    const DOW_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    /* ── State ── */
    let state = { row2Mode: 'tomorrow', data: {} };
    let ui    = {
        year: new Date().getFullYear(),
        month: new Date().getMonth(),
        activeDate: null,
    };

    /* ── Persist ── */
    function loadState() {
        try {
            const s = localStorage.getItem('workProgressState_v1');
            if (s) {
                const saved = JSON.parse(s);
                state.row2Mode = saved.row2Mode || 'tomorrow';
                state.data     = saved.data     || {};
            }
        } catch(_) {}
    }

    let saveTimer;
    function saveState() {
        const el = document.getElementById('save-status');
        el.textContent = 'Saving…';
        el.classList.add('saving');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
            localStorage.setItem('workProgressState_v1', JSON.stringify(state));
            el.textContent = 'Saved';
            el.classList.remove('saving');
        }, 400);
    }

    /* ── Helpers ── */
    function todayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function ensureDate(ds) {
        if (!state.data[ds]) state.data[ds] = { today:'', tomorrow:'', nextweek:'', notes:'' };
    }

    function nextKey() { return state.row2Mode === 'tomorrow' ? 'tomorrow' : 'nextweek'; }

    function isoWeek(ds) {
        const d = new Date(ds + 'T00:00:00');
        const day = d.getDay() || 7;
        const thu = new Date(d);
        thu.setDate(d.getDate() + 4 - day);
        const yearStart = new Date(thu.getFullYear(), 0, 1);
        return Math.ceil(((thu - yearStart) / 86400000 + 1) / 7);
    }

    function fmtModalDate(ds) {
        const d = new Date(ds + 'T00:00:00');
        const dow = DOW_EN[d.getDay()];
        return {
            big: `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`,
            sub: `${dow} · Week ${isoWeek(ds)}`,
        };
    }

    /* ── Calendar ── */
    function renderCalendar() {
        const grid = document.getElementById('cal-grid');
        grid.innerHTML = '';

        const today = todayStr();
        document.getElementById('cal-month-label').textContent =
            `${MONTHS[ui.month]} ${ui.year}`;

        // First day of month, offset to Monday start
        const first = new Date(ui.year, ui.month, 1);
        const startOffset = first.getDay(); // 0=Sun
        const startDate = new Date(first);
        startDate.setDate(first.getDate() - startOffset);

        for (let i = 0; i < 42; i++) {
            const d = new Date(startDate);
            d.setDate(startDate.getDate() + i);
            const ds = d.toISOString().split('T')[0];
            const inMonth = d.getMonth() === ui.month;
            const isToday = ds === today;
            const dow     = d.getDay(); // 0=Sun, 6=Sat
            const isWeekend = dow === 0 || dow === 6;
            const data    = state.data[ds] || {};
            const hasTod  = !!(data.today     && data.today.trim());
            const hasNxt  = !!(data[nextKey()] && data[nextKey()].trim());
            const hasNts  = !!(data.notes      && data.notes.trim());
            const hasAny  = hasTod || hasNxt || hasNts;
            const preview = data.today ? data.today.split('\n')[0].trim() : '';

            const cell = document.createElement('div');
            const cls = ['cal-cell'];
            if (!inMonth) cls.push('other-month');
            if (isToday)  cls.push('is-today');
            if (isWeekend && inMonth) cls.push('weekend');
            cell.className = cls.join(' ');

            // Date number
            const numEl = document.createElement('div');
            numEl.className = 'cal-num';
            numEl.textContent = d.getDate();
            cell.appendChild(numEl);

            // Preview text (in-month only)
            if (inMonth && preview) {
                const prevEl = document.createElement('div');
                prevEl.className = 'cal-preview';
                prevEl.textContent = preview;
                cell.appendChild(prevEl);
            }

            // Indicator dots
            if (inMonth && hasAny) {
                const dotsEl = document.createElement('div');
                dotsEl.className = 'cal-dots';
                if (hasTod) dotsEl.innerHTML += '<span class="dot dot-today"></span>';
                if (hasNxt) dotsEl.innerHTML += '<span class="dot dot-next"></span>';
                if (hasNts) dotsEl.innerHTML += '<span class="dot dot-notes"></span>';
                cell.appendChild(dotsEl);
            }

            cell.addEventListener('click', () => {
                if (!inMonth) {
                    ui.year  = d.getFullYear();
                    ui.month = d.getMonth();
                    renderCalendar();
                }
                openModal(ds);
            });

            grid.appendChild(cell);
        }
    }

    /* ── Modal ── */
    function openModal(ds) {
        ui.activeDate = ds;
        ensureDate(ds);
        const data = state.data[ds];
        const fmt  = fmtModalDate(ds);

        document.getElementById('modal-date-big').textContent = fmt.big;
        document.getElementById('modal-date-sub').textContent = fmt.sub;
        document.getElementById('f-today').value = data.today     || '';
        document.getElementById('f-next').value  = data[nextKey()] || '';
        document.getElementById('f-notes').value = data.notes     || '';

        syncToggleUI();
        document.getElementById('modal-backdrop').classList.add('open');
        setTimeout(() => document.getElementById('f-today').focus(), 60);
    }

    function closeModal() {
        document.getElementById('modal-backdrop').classList.remove('open');
        ui.activeDate = null;
        renderCalendar();
    }

    function onBackdropClick(e) {
        if (e.target === document.getElementById('modal-backdrop')) closeModal();
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* Auto-save on input */
    ['f-today','f-next','f-notes'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => {
            if (!ui.activeDate) return;
            ensureDate(ui.activeDate);
            const d = state.data[ui.activeDate];
            d.today  = document.getElementById('f-today').value;
            d[nextKey()] = document.getElementById('f-next').value;
            d.notes  = document.getElementById('f-notes').value;
            saveState();
        });
    });

    function toggleMode() {
        if (ui.activeDate) {
            // Persist before switching
            state.data[ui.activeDate][nextKey()] = document.getElementById('f-next').value;
        }
        state.row2Mode = state.row2Mode === 'tomorrow' ? 'nextweek' : 'tomorrow';
        saveState();
        if (ui.activeDate) {
            document.getElementById('f-next').value = state.data[ui.activeDate][nextKey()] || '';
        }
        syncToggleUI();
    }

    function syncToggleUI() {
        const tomorrow = state.row2Mode === 'tomorrow';
        document.getElementById('f-next-lbl').textContent  = tomorrow ? '02 · 明日工作進度' : '02 · 下週工作進度';
        document.getElementById('f-toggle').textContent    = tomorrow ? '切換→ 下週' : '切換→ 明日';
        document.getElementById('f-next').placeholder      = tomorrow ? '明日計畫…' : '下週計畫…';
    }

    /* ── Nav ── */
    function prevMonth() {
        if (ui.month === 0) { ui.month = 11; ui.year--; }
        else ui.month--;
        renderCalendar();
    }
    function nextMonth() {
        if (ui.month === 11) { ui.month = 0; ui.year++; }
        else ui.month++;
        renderCalendar();
    }
    function goToday() {
        const now = new Date();
        ui.year  = now.getFullYear();
        ui.month = now.getMonth();
        renderCalendar();
    }

    /* ── Export ── */
    function exportJSON() {
        dl('work-progress.json', JSON.stringify(state, null, 2), 'application/json');
    }
    function exportCSV() {
        const dates = Object.keys(state.data).sort();
        const rows = [['日期','當日','明日','下週','備註']];
        dates.forEach(ds => {
            const d = state.data[ds];
            if (d.today || d.tomorrow || d.nextweek || d.notes)
                rows.push([ds, d.today||'', d.tomorrow||'', d.nextweek||'', d.notes||'']);
        });
        const csv = rows.map(r => r.map(c => `"${c.replace(/"/g,'""')}"`).join(',')).join('\r\n');
        dl('work-progress.csv', '﻿'+csv, 'text/csv');
    }
    function dl(name, content, mime) {
        const a = Object.assign(document.createElement('a'), {
            href: URL.createObjectURL(new Blob([content], {type:mime})),
            download: name
        });
        a.click(); URL.revokeObjectURL(a.href);
    }

    /* ── Init ── */
    document.getElementById('footer-date').textContent =
        new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric' });

    loadState();
    renderCalendar();
</script>
</body>
</html>
